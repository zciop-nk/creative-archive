<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Poster Review Board</title>
<link rel="stylesheet" href="./styles/poster-system.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#eae6dc;color:#111;font-family:Pretendard,"Apple SD Gothic Neo",sans-serif}
.wrap{max-width:1500px;margin:auto;padding:24px 20px 60px}.top{display:flex;justify-content:space-between;gap:20px;align-items:end;border-bottom:1px solid #aaa397;padding-bottom:13px}.top small{font-size:10px;color:#736e65}.top h1{font-size:28px;letter-spacing:-.04em;margin:4px 0 0}.top a{border:1px solid #aaa397;padding:8px 10px;font-size:11px;text-decoration:none;color:#111}
.groups{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 18px}.groups button{border:1px solid #aaa397;background:transparent;padding:7px 9px;font-size:10px}.groups button.active{background:#111;color:#fff;border-color:#111}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:26px 18px}.item{min-width:0;position:relative}.caption{font-size:12px;margin-top:7px;display:flex;justify-content:space-between;gap:8px}.caption span{color:#706b63;font-size:10px}.qa-badge{position:absolute;top:7px;right:7px}
@media(max-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:620px){.grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body><main class="wrap">
<div class="top"><div><small>POSTER REVIEW BOARD / ENGINE OUTPUT</small><h1 id="title">검토 보드</h1></div><a href="./index.html">← 아카이브로</a></div>
<div id="groups" class="groups"></div><section id="grid" class="grid"></section>
</main>
<script type="module">
import { PROJECT_SPECS } from "./data/project-specs.js";
import { POSTER_WORKS } from "./data/poster-content.js";
import { renderPoster } from "./engine/renderer.js";
import { domQA } from "./engine/qa.js";
const $=s=>document.querySelector(s);let group=0;
const chunks=[];for(let i=0;i<POSTER_WORKS.length;i+=10)chunks.push(POSTER_WORKS.slice(i,i+10));
function renderGroups(){
  $("#groups").innerHTML=chunks.map((x,i)=>'<button class="'+(i===group?"active":"")+'" data-i="'+i+'">'+String(i*10+1).padStart(3,"0")+'–'+String(Math.min((i+1)*10,POSTER_WORKS.length)).padStart(3,"0")+'</button>').join("");
  $("#groups").querySelectorAll("button").forEach(b=>b.onclick=()=>{group=Number(b.dataset.i);render()});
}
function render(){
  renderGroups();const items=chunks[group]||[];
  $("#title").textContent="검토 보드 "+String(group*10+1).padStart(3,"0")+"–"+String(Math.min((group+1)*10,POSTER_WORKS.length)).padStart(3,"0");
  $("#grid").innerHTML=items.map(w=>{const out=renderPoster(w,PROJECT_SPECS[w.projectId]);return '<article class="item"><div class="poster-shell">'+out.html+'</div><span class="qa-badge '+(out.model.qa.pass?"":"fail")+'">'+(out.model.qa.pass?"PASS":"REVIEW")+'</span><div class="caption"><b>'+w.id+' / '+w.title+'</b><span>'+w.template+'</span></div></article>'}).join("");
  requestAnimationFrame(()=>$("#grid").querySelectorAll(".item").forEach(item=>{const qa=domQA(item.querySelector(".poster-shell"));if(!qa.pass){const b=item.querySelector(".qa-badge");b.textContent="REVIEW";b.classList.add("fail");b.title=qa.issues.join("\n")}}));
}
render();
</script>
</body></html>
