<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Creative Archive</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f4f0;color:#111;font:14px Arial,sans-serif}header{position:sticky;top:0;z-index:5;display:flex;gap:8px;align-items:center;padding:14px 20px;background:#f4f4f0e8;border-bottom:1px solid #ccc;backdrop-filter:blur(10px)}b{letter-spacing:-.03em}.sp{flex:1}button,input,select{font:inherit;border:1px solid #ccc;background:#fff;border-radius:999px;padding:9px 12px}button{cursor:pointer}.on{background:#111;color:#fff}.wrap{max-width:1500px;margin:auto;padding:24px 20px 70px}h1{font-size:clamp(48px,8vw,108px);line-height:.84;letter-spacing:-.075em;margin:24px 0 48px}.tools{display:flex;gap:8px;flex-wrap:wrap}.tools input{flex:1;min-width:220px}.sec{border-top:1px solid #111;margin-top:28px;padding-top:10px;display:flex;justify-content:space-between}.projects{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.p{background:#fff;border:1px solid #ccc;border-radius:10px;padding:15px;min-height:135px;display:flex;flex-direction:column}.p h3{font-size:20px;margin:9px 0}.p small{color:#777}.p i{margin-top:auto;font-style:normal}.works{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.card .thumb{aspect-ratio:4/5;border:1px solid #ccc;border-radius:7px;overflow:hidden;position:relative}.deck .thumb,.ui .thumb{aspect-ratio:16/10}.meta{padding-top:7px;font-size:12px}.poster{height:100%;padding:8%;background:#f7f1df;position:relative}.poster h2{font-size:clamp(24px,5cqw,66px);line-height:.88;letter-spacing:-.06em;margin:18% 0}.poster em{position:absolute;right:7%;bottom:5%;font-size:12cqw;font-weight:900;font-style:normal}.slide{height:100%;padding:7%;background:#f7f7f2}.slide h2{font-size:7cqw;line-height:.95;letter-spacing:-.05em}.uiBox{height:100%;padding:5%;background:#eef1f4}.uiWin{height:100%;border:1px solid #d7dbe0;background:#fff;border-radius:10px;padding:7%}.uiWin h2{font-size:5cqw}.person{height:100%;background:linear-gradient(145deg,#ddd2c6,#aaa);position:relative}.head{position:absolute;left:38%;top:14%;width:25%;height:27%;border-radius:48%;background:#d3a98d;box-shadow:0 0 0 12px #111}.body{position:absolute;left:20%;bottom:-8%;width:60%;height:65%;background:#111;border-radius:50% 50% 20% 20%}.drawer{position:fixed;top:0;right:-760px;bottom:0;width:min(720px,96vw);background:#fff;z-index:9;box-shadow:-20px 0 70px #0003;transition:.2s;padding:18px;overflow:auto}.drawer.open{right:0}.stage{background:#ddd;padding:20px;border-radius:10px;overflow:auto}.big{width:540px;height:675px;margin:auto}.big.slide{width:640px;height:360px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.actions button{border-radius:8px}.empty{grid-column:1/-1;padding:50px;text-align:center;color:#777;border:1px dashed #bbb;border-radius:10px}.modal{position:fixed;inset:0;background:#0006;z-index:10;display:none;place-items:center}.modal.on{display:grid}.box{width:min(620px,94vw);background:#fff;padding:20px;border-radius:14px}.box textarea,.box input,.box select{width:100%;margin:5px 0 10px;border:1px solid #ccc;border-radius:8px;padding:10px}.box textarea{height:130px}@media(max-width:900px){.projects{grid-template-columns:repeat(2,1fr)}.works{grid-template-columns:repeat(3,1fr)}}@media(max-width:600px){.projects{grid-template-columns:1fr}.works{grid-template-columns:repeat(2,1fr)}header .tab{display:none}}
</style></head><body><header><b>CREATIVE ARCHIVE</b><span class="sp"></span><span id="tabs"></span><button id="new">+ 프로젝트</button><button id="cmd" class="on">ChatGPT 명령</button></header><main class="wrap"><h1>One archive.<br>Four creative modes.</h1><div class="tools"><input id="q" placeholder="검색"><select id="status"><option value="all">전체 상태</option><option value="fav">즐겨찾기</option><option value="approved">승인</option><option value="revise">수정</option></select></div><div class="sec"><b>PROJECTS</b><span id="pc"></span></div><section id="projects" class="projects"></section><div class="sec"><b>ARCHIVE</b><span id="wc"></span></div><section id="works" class="works"></section></main><aside id="drawer" class="drawer"><button onclick="drawer.classList.remove('open')">← 닫기</button><h2 id="dt"></h2><div id="db"></div></aside><div id="modal" class="modal"><div class="box"><h2 id="mt">ChatGPT 명령</h2><div id="form"></div><button onclick="modal.classList.remove('on')">닫기</button></div></div>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script><script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script><script>
/* CHATGPT: normal content updates modify ARCHIVE_DATA only. */
window.ARCHIVE_DATA={repository:'zciop-nk/creative-archive',projects:[
{id:'people-001',category:'people',name:'Casting Room Starter',designSystem:{ratio:'4:5',rules:['face consistency','editorial']},works:[{id:'001',title:'CASTING 01',type:'person'}]},
{id:'poster-001',category:'poster',name:'Editorial Poster Starter',designSystem:{canvas:'1080x1350',rules:['12col','strong type','no SaaS cards']},works:[{id:'001',title:'MORNING ARCHIVE',type:'poster'},{id:'002',title:'FIELD NOTES',type:'poster'}]},
{id:'ppt-001',category:'ppt',name:'Editorial Deck Starter',designSystem:{ratio:'16:9',rules:['deck consistency','narrative first']},works:[{id:'001',title:'AI SERVICE PROPOSAL',type:'deck',slides:[{title:'AI SERVICE\nPROPOSAL',body:'A concise narrative system.'},{title:'Problem → Direction',body:'Turn information into a route.'},{title:'One system. Three routes.',body:'Immediate, bridge, adjacent.'}]}]},
{id:'uiux-001',category:'uiux',name:'Product UI Starter',designSystem:{rules:['border-first','clear states']},works:[{id:'001',title:'Analytics Dashboard',type:'ui'}]}
]};
const cats=[['all','전체'],['people','인물/애니'],['poster','포스터'],['ppt','PPT'],['uiux','UIUX']],S=JSON.parse(localStorage.ca||'{}');let cat='all',sel=null;const $=s=>document.querySelector(s),esc=s=>(s||'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));function rv(p,w){return S[p.id+'::'+w.id]||{fav:false,status:''}}function save(){localStorage.ca=JSON.stringify(S)}function items(){let a=ARCHIVE_DATA.projects.flatMap(p=>p.works.map(w=>({p,w})));if(cat!='all')a=a.filter(x=>x.p.category==cat);let q=$('#q').value.toLowerCase();if(q)a=a.filter(x=>(x.p.name+' '+x.w.title).toLowerCase().includes(q));let st=$('#status').value;if(st!='all')a=a.filter(x=>st=='fav'?rv(x.p,x.w).fav:rv(x.p,x.w).status==st);return a}
function thumb(w){if(w.type=='poster')return `<div class="poster"><small>ISSUE ${w.id}</small><h2>${esc(w.title)}</h2><em>${w.id}</em></div>`;if(w.type=='person')return `<div class="person"><div class="head"></div><div class="body"></div></div>`;if(w.type=='deck')return `<div class="slide"><small>PRESENTATION</small><h2>${esc(w.slides[0].title).replace(/\n/g,'<br>')}</h2></div>`;return `<div class="uiBox"><div class="uiWin"><small>PRODUCT</small><h2>${esc(w.title)}</h2><hr><p>Overview · Analytics · Users</p></div></div>`}
function render(){tabs.innerHTML=cats.map(c=>`<button class="tab ${cat==c[0]?'on':''}" onclick="cat='${c[0]}';render()">${c[1]}</button>`).join('');let ps=ARCHIVE_DATA.projects.filter(p=>cat=='all'||p.category==cat);projects.innerHTML=ps.map(p=>`<article class="p"><small>${p.category.toUpperCase()}</small><h3>${esc(p.name)}</h3><span>${JSON.stringify(p.designSystem.rules||[])}</span><i>${p.works.length} ${p.category=='ppt'?'DECKS':'WORKS'}</i></article>`).join('');pc.textContent=ps.length+' projects';let a=items();works.innerHTML=a.length?a.map(({p,w})=>`<article class="card ${w.type=='deck'?'deck':w.type=='ui'?'ui':''}" onclick="openD('${p.id}','${w.id}')"><div class="thumb">${thumb(w)}</div><div class="meta">${w.id} · ${esc(w.title)} ${rv(p,w).status?'· '+rv(p,w).status:''}</div></article>`).join(''):'<div class="empty">결과물이 없습니다.</div>';wc.textContent=a.length+' items'}
function openD(pid,wid){let p=ARCHIVE_DATA.projects.find(x=>x.id==pid),w=p.works.find(x=>x.id==wid);sel={p,w};dt.textContent=w.title;let content=w.type=='deck'?w.slides.map((s,i)=>`<div class="big slide" data-slide><small>${i+1}/${w.slides.length}</small><h2>${esc(s.title).replace(/\n/g,'<br>')}</h2><p>${esc(s.body)}</p></div>`).join('<br>'):`<div class="big" data-export>${thumb(w)}</div>`;db.innerHTML=`<div class="stage">${content}</div><div class="actions"><button onclick="png()">PNG</button><button onclick="pdf()">${w.type=='deck'?'전체 Deck PDF':'PDF'}</button><button onclick="mark('fav')">☆ 즐겨찾기</button><button onclick="mark('approved')">승인</button><button onclick="mark('revise')">수정</button></div>`;drawer.classList.add('open')}
async function cap(el,scale=3){await document.fonts?.ready;return html2canvas(el,{scale,backgroundColor:'#fff',useCORS:true})}function dl(b,n){let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click()}async function png(){let el=sel.w.type=='deck'?document.querySelector('[data-slide]'):document.querySelector('[data-export]'),c=await cap(el);c.toBlob(b=>dl(b,sel.p.id+'-'+sel.w.id+'.png'))}async function pdf(){let {jsPDF}=jspdf;if(sel.w.type=='deck'){let ss=[...document.querySelectorAll('[data-slide]')],d;for(let i=0;i<ss.length;i++){let c=await cap(ss[i],2);if(!d)d=new jsPDF({orientation:'landscape',unit:'px',format:[640,360]});else d.addPage([640,360],'landscape');d.addImage(c.toDataURL(),'PNG',0,0,640,360)}d.save(sel.p.id+'-'+sel.w.id+'.pdf')}else{let el=document.querySelector('[data-export]'),c=await cap(el,2),d=new jsPDF({unit:'px',format:[540,675]});d.addImage(c.toDataURL(),'PNG',0,0,540,675);d.save(sel.p.id+'-'+sel.w.id+'.pdf')}}function mark(v){let k=sel.p.id+'::'+sel.w.id,r=rv(sel.p,sel.w);if(v=='fav')r.fav=!r.fav;else r.status=v;S[k]=r;save();render();openD(sel.p.id,sel.w.id)}
q.oninput=render;status.onchange=render;cmd.onclick=()=>{mt.textContent='ChatGPT 명령';form.innerHTML=`<select id="cp">${ARCHIVE_DATA.projects.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select><textarea id="ct"></textarea><button class="on" onclick="copyCmd()">명령 복사</button>`;cp.onchange=fill;fill();modal.classList.add('on')};function fill(){let p=ARCHIVE_DATA.projects.find(x=>x.id==cp.value);ct.value=`GitHub 저장소 zciop-nk/creative-archive의 ${p.id} (${p.name}) 프로젝트를 적용해. index.html의 ARCHIVE_DATA와 designSystem을 먼저 읽고 기존 규격을 유지해. 중복 없이 10개 추가 생성해서 다읈 번호부터 works에 등록하고 main에 커밋해. PPT면 10개 슬라이드가 아니라 완성 Deck 10개를 뜻하며 각 Deck 전체가 하나의 디자인 세트여야 해.`}async function copyCmd(){await navigator.clipboard.writeText(ct.value);alert('복사됨')}
new.onclick=()=>{mt.textContent='신규 프로젝트';form.innerHTML=`<select id="nc"><option value="people">인물/애니</option><option value="poster">포스터</option><option value="ppt">PPT</option><option value="uiux">UIUX</option></select><input id="nn" placeholder="프로젝트 이름"><textarea id="nt" placeholder="추가 요구사항"></textarea><button class="on" onclick="copyNew()">신규 프로젝트 명령 복사</button>`;modal.classList.add('on')};async function copyNew(){let t=`GitHub 저장소 zciop-nk/creative-archive에 신규 프로젝트를 추가해. 메뉴 ${nc.value}, 이름 ${nn.value}. 지금 Chat에 첨부한 참고자료를 분석해 공통 시각 규칙을 designSystem으로 구조화하고 index.html의 ARCHIVE_DATA.projects에 등록해. 테스트 10개만 생성해. ${nc.value=='ppt'?'PPT는 슬라이드 낱장이 아니라 전체 Deck 한 세트가 작품 1개이고 전체 슬라이드 디자인과 서사를 일관되게 유지해.':''} 추가 요구: ${nt.value}`;await navigator.clipboard.writeText(t);alert('복사됨')}
render();</script></body></html>
